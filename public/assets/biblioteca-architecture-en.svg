<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Biblioteca Circulante architecture</title>
  <desc id="desc">The application connects a Next.js interface with Google authentication and a Fastify API. The API validates permissions and domain rules, processes images and persists data through Prisma in MariaDB.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto"><path d="M1 1l9 5-9 5" fill="none" stroke="#f4bf4f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="150%"><feOffset in="SourceGraphic" dx="0" dy="0"/></filter>
  </defs>
  <rect width="1200" height="760" fill="#18332f"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="70" y="62" fill="#bad3cd" font-size="19" font-weight="700" letter-spacing="2">APPLICATION ARCHITECTURE</text>
    <text x="70" y="106" fill="#f7f8f5" font-size="34" font-weight="700">Separated layers, domain protected by the API</text>
    <path d="M285 370H363M615 370H693M945 370H1021M489 244V193H620M819 244V193H972M819 496V557" fill="none" stroke="#f4bf4f" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/>
    <text x="324" y="350" fill="#bad3cd" font-size="15" text-anchor="middle">uses</text><text x="654" y="350" fill="#bad3cd" font-size="15" text-anchor="middle">validates</text><text x="983" y="350" fill="#bad3cd" font-size="15" text-anchor="middle">persists</text>
    <g transform="translate(70 290)" filter="url(#shadow)"><rect width="215" height="160" rx="22" fill="#f7f8f5"/><rect width="215" height="12" rx="6" fill="#e95c45"/><text x="24" y="56" fill="#5d6864" font-size="15" font-weight="700">PEOPLE</text><text x="24" y="91" fill="#202124" font-size="24" font-weight="700">Members</text><text x="24" y="120" fill="#202124" font-size="18">Librarians</text><text x="24" y="146" fill="#202124" font-size="18">Administrators</text></g>
    <g transform="translate(363 244)" filter="url(#shadow)"><rect width="252" height="252" rx="22" fill="#f7f8f5"/><rect width="252" height="12" rx="6" fill="#f4a621"/><text x="26" y="59" fill="#5d6864" font-size="15" font-weight="700">RESPONSIVE UI</text><text x="26" y="98" fill="#202124" font-size="25" font-weight="700">Next.js 16</text><text x="26" y="129" fill="#5d6864" font-size="17">React · TypeScript</text><line x1="26" y1="157" x2="226" y2="157" stroke="#d8ded7" stroke-width="2"/><text x="26" y="194" fill="#202124" font-size="17">Role-based navigation</text><text x="26" y="222" fill="#202124" font-size="17">States and forms</text></g>
    <g transform="translate(693 244)" filter="url(#shadow)"><rect width="252" height="252" rx="22" fill="#f7f8f5"/><rect width="252" height="12" rx="6" fill="#0f766e"/><text x="26" y="59" fill="#5d6864" font-size="15" font-weight="700">DOMAIN SERVICE</text><text x="26" y="98" fill="#202124" font-size="25" font-weight="700">Fastify API</text><text x="26" y="129" fill="#5d6864" font-size="17">Node.js · Zod</text><line x1="26" y1="157" x2="226" y2="157" stroke="#d8ded7" stroke-width="2"/><text x="26" y="194" fill="#202124" font-size="17">Permissions and rules</text><text x="26" y="222" fill="#202124" font-size="17">State transitions</text></g>
