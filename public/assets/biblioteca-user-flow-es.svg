<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Flujo de préstamo de Biblioteca Circulante</title>
  <desc id="desc">El flujo muestra cómo una persona publica ejemplares, se inscribe a un evento, pide un libro, recibe una asignación, confirma la entrega y finalmente devuelve el ejemplar.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto"><path d="M1 1l9 5-9 5" fill="none" stroke="#f4bf4f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="150%"><feOffset in="SourceGraphic" dx="0" dy="0"/></filter>
  </defs>
  <rect width="1200" height="760" fill="#18332f"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="70" y="62" fill="#bad3cd" font-size="19" font-weight="700" letter-spacing="2">USER FLOW · PRÉSTAMO EN UN EVENTO</text>
    <text x="70" y="106" fill="#f7f8f5" font-size="34" font-weight="700">Del catálogo comunitario al intercambio presencial</text>
    <text x="70" y="139" fill="#bad3cd" font-size="18">Las decisiones críticas se confirman entre personas y quedan registradas.</text>

    <path d="M298 254H378M662 254H742M1020 306V416M742 526H662M378 526H298" fill="none" stroke="#f4bf4f" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/>

    <g transform="translate(70 184)" filter="url(#shadow)">
      <rect width="228" height="140" rx="20" fill="#f7f8f5"/>
      <circle cx="34" cy="34" r="20" fill="#e95c45"/><text x="34" y="41" fill="#fff" font-size="18" font-weight="700" text-anchor="middle">1</text>
      <text x="24" y="85" fill="#202124" font-size="24" font-weight="700">Publicar</text>
      <text x="24" y="113" fill="#5d6864" font-size="16">Carga el ejemplar</text>
    </g>
    <g transform="translate(378 184)" filter="url(#shadow)">
      <rect width="284" height="140" rx="20" fill="#f7f8f5"/>
      <circle cx="34" cy="34" r="20" fill="#f4a621"/><text x="34" y="41" fill="#18332f" font-size="18" font-weight="700" text-anchor="middle">2</text>
      <text x="24" y="85" fill="#202124" font-size="24" font-weight="700">Inscribirse</text>
      <text x="24" y="113" fill="#5d6864" font-size="16">Elige qué libros llevar</text>
    </g>
    <g transform="translate(742 184)" filter="url(#shadow)">
      <rect width="278" height="140" rx="20" fill="#f7f8f5"/>
      <circle cx="34" cy="34" r="20" fill="#0f766e"/><text x="34" y="41" fill="#fff" font-size="18" font-weight="700" text-anchor="middle">3</text>
      <text x="24" y="85" fill="#202124" font-size="24" font-weight="700">Pedir</text>
      <text x="24" y="113" fill="#5d6864" font-size="16">Solicita dentro del evento</text>
    </g>

    <g transform="translate(742 456)" filter="url(#shadow)">
      <rect width="278" height="140" rx="20" fill="#f7f8f5"/>
      <circle cx="34" cy="34" r="20" fill="#0f766e"/><text x="34" y="41" fill="#fff" font-size="18" font-weight="700" text-anchor="middle">4</text>
      <text x="24" y="85" fill="#202124" font-size="24" font-weight="700">Asignar</text>
      <text x="24" y="113" fill="#5d6864" font-size="16">Admin resuelve pedidos</text>
    </g>
    <g transform="translate(378 456)" filter="url(#shadow)">
      <rect width="284" height="140" rx="20" fill="#f7f8f5"/>
      <circle cx="34" cy="34" r="20" fill="#f4a621"/><text x="34" y="41" fill="#18332f" font-size="18" font-weight="700" text-anchor="middle">5</text>
      <text x="24" y="85" fill="#202124" font-size="24" font-weight="700">Entregar</text>
      <text x="24" y="113" fill="#5d6864" font-size="16">Escanea QR y confirma</text>
    </g>
    <g transform="translate(70 456)" filter="url(#shadow)">
      <rect width="228" height="140" rx="20" fill="#f7f8f5"/>
      <circle cx="34" cy="34" r="20" fill="#e95c45"/><text x="34" y="41" fill="#fff" font-size="18" font-weight="700" text-anchor="middle">6</text>
      <text x="24" y="85" fill="#202124" font-size="24" font-weight="700">Devolver</text>
      <text x="24" y="113" fill="#5d6864" font-size="16">Cierra el préstamo</text>
    </g>

    <rect x="70" y="655" width="1060" height="50" rx="14" fill="#22443f" stroke="#41635d"/>
    <text x="600" y="687" fill="#f7f8f5" font-size="17" text-anchor="middle"><tspan font-weight="700">Resultado:</tspan> vuelve al dueño · queda disponible · conserva su historial</text>
  </g>
</svg>
