    <g transform="translate(363 244)" filter="url(#shadow)"><rect width="252" height="252" rx="22" fill="#f7f8f5"/><rect width="252" height="12" rx="6" fill="#f4a621"/><text x="26" y="59" fill="#5d6864" font-size="15" font-weight="700">INTERFAZ RESPONSIVE</text><text x="26" y="98" fill="#202124" font-size="25" font-weight="700">Next.js 16</text><text x="26" y="129" fill="#5d6864" font-size="17">React · TypeScript</text><line x1="26" y1="157" x2="226" y2="157" stroke="#d8ded7" stroke-width="2"/><text x="26" y="194" fill="#202124" font-size="17">Navegación por rol</text><text x="26" y="222" fill="#202124" font-size="17">Estados y formularios</text></g>
