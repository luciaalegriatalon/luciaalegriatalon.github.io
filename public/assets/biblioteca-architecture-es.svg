<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Arquitectura de Biblioteca Circulante</title>
  <desc id="desc">La aplicación conecta una interfaz Next.js con autenticación Google y una API Fastify. La API valida permisos y dominio, procesa imágenes y persiste datos con Prisma en MariaDB.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto"><path d="M1 1l9 5-9 5" fill="none" stroke="#f4bf4f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="150%"><feOffset in="SourceGraphic" dx="0" dy="0"/></filter>
  </defs>
  <rect width="1200" height="760" fill="#18332f"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="70" y="62" fill="#bad3cd" font-size="19" font-weight="700" letter-spacing="2">ARQUITECTURA DE LA APLICACIÓN</text>
    <text x="70" y="106" fill="#f7f8f5" font-size="34" font-weight="700">Capas separadas, dominio protegido por la API</text>

    <path d="M285 370H363M615 370H693M945 370H1021M489 244V193H620M819 244V193H972M819 496V557" fill="none" stroke="#f4bf4f" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/>
    <text x="324" y="350" fill="#bad3cd" font-size="15" text-anchor="middle">usa</text>
    <text x="654" y="350" fill="#bad3cd" font-size="15" text-anchor="middle">valida</text>
    <text x="983" y="350" fill="#bad3cd" font-size="15" text-anchor="middle">persiste</text>

